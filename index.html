  <!-- ===== Google Fonts: Inter ===== -->

  <link rel="stylesheet" href="css/design-system.css">

  <!-- ===== Splash Screen Inline Style (prevents FOUC) ===== -->
  <style>
    .splash-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #F5F5F0;
      z-index: 99999;
      transition: opacity 0.4s ease;
    }
    .splash-loader.hide {
      opacity: 0;
      pointer-events: none;
    }
    .splash-loader__icon {
      width: 72px;
      height: 72px;
      margin-bottom: 16px;
      animation: splashBounce 1s ease infinite;
    }
    .splash-loader__text {
      font-family: 'Inter', sans-serif;
      font-weight: 900;
      font-style: italic;
      font-size: 1.75rem;
      color: #1B6B3C;
    }
    .splash-loader__sub {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 0.875rem;
      color: #666666;
      margin-top: 4px;
    }
    @keyframes splashBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
  </style>
</head>
<body>

  <!-- ===== Splash Screen ===== -->
  <div class="splash-loader" id="splash">
    <svg class="splash-loader__icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="14" y="18" width="36" height="36" rx="4" stroke="#1B6B3C" stroke-width="4" fill="#C8E6C9"/>
      <path d="M18 18L22 8H42L46 18" stroke="#1B6B3C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="32" y1="28" x2="32" y2="44" stroke="#1B6B3C" stroke-width="3" stroke-linecap="round"/>
      <line x1="24" y1="36" x2="40" y2="36" stroke="#1B6B3C" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <div class="splash-loader__text">Sahi Bin</div>
    <div class="splash-loader__sub">स्मार्ट कचरा प्रबंधन</div>
  </div>

  <!-- ===== App Root ===== -->
  <div id="app"></div>

  <!-- ===== Toast Notifications ===== -->
  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- ===== Modal Container ===== -->
  <div id="modal-container" role="dialog" aria-modal="true"></div>

  <!-- ===== Network Status Banner ===== -->
  <div id="network-banner" role="alert" aria-live="assertive"></div>

  <!-- ===== Firebase SDK v10 (ESM from CDN) ===== -->
  <!-- Loaded as module imports inside js/app.js via importmap or direct URLs -->

  <!-- ===== Main Application Script ===== -->
  <script type="module" src="js/app.js"></script>

  <!-- ===== Service Worker Registration ===== -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const registration = await navigator.serviceWorker.register('/sw.js', {
            scope: '/'
          });
          console.log('[SW] Registered with scope:', registration.scope);

          // Listen for updates
          registration.addEventListener('updatefound', () => {
            const newWorker = registration.installing;
            console.log('[SW] Update found, installing...');

            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                // New version available — notify the user
                const event = new CustomEvent('sw-update-available', {
                  detail: { registration }
                });
                window.dispatchEvent(event);
              }
            });
          });

          // Handle controller change (skip waiting accepted)
          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });

        } catch (error) {
          console.error('[SW] Registration failed:', error);
        }
      });
    }
  </script>
</body>
</html>
